{% extends "base.html" %}

{% block title %}Likes | PhotoShare{% endblock %}

{% block content %}
<header class="page-header">
    <div>
        <p class="eyebrow">Photo</p>
        <h1>Liked By</h1>
        <p class="page-subtitle">People who liked this photo.</p>
    </div>
</header>

{% if likesby %}
    <ul class="simple-list">
        {% for likeby in likesby %}
            <li>{{ likeby }}</li>
        {% endfor %}
    </ul>
{% else %}
    <div class="empty-state">No likes yet.</div>
{% endif %}
{% endblock %}
