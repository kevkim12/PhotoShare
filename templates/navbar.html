<nav class="site-header" aria-label="Primary navigation">
    <a class="navbar__brand" href="/">PhotoShare</a>
    <ul class="navbar__links">
        <li><a class="nav-link {% if request.path == '/' %}is-active{% endif %}" href="/">Home</a></li>
        <li><a class="nav-link {% if request.path.startswith('/albums') %}is-active{% endif %}" href="/albums">Albums</a></li>
        <li><a class="nav-link {% if request.path.startswith('/photosearch') %}is-active{% endif %}" href="/photosearch">Search</a></li>
        <li><a class="nav-link {% if request.path.startswith('/leaderboard') %}is-active{% endif %}" href="/leaderboard">Leaderboard</a></li>
        {% if current_user.is_authenticated %}
            <li><a class="nav-link {% if request.path.startswith('/userAlbums') %}is-active{% endif %}" href="/userAlbums">Your Albums</a></li>
            <li><a class="nav-link {% if request.path.startswith('/friends') %}is-active{% endif %}" href="/friends">Friends</a></li>
        {% endif %}
    </ul>
    <div class="navbar__actions">
        {% if current_user.is_authenticated %}
            <a class="button button--secondary" href="/upload">Upload</a>
            <a class="button" href="/logout">Log Out</a>
        {% else %}
            <a class="button button--secondary" href="/register">Register</a>
            <a class="button" href="/login">Log In</a>
        {% endif %}
    </div>
</nav>
